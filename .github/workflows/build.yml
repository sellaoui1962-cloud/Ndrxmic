name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Unzip and build
        run: |
          Z=$(ls ndrXmic*.zip 2>/dev/null | head -n1)
          [ -z "$Z" ] && Z=$(ls *.zip | head -n1)
          echo "Using $Z"
          rm -rf src && mkdir src
          unzip -q "$Z" -d src
          D=$(dirname "$(find src -name settings.gradle.kts | head -n1)")
          cd "$D"
          gradle assembleDebug --no-daemon
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/out/ndrXmic.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: ndrXmic-apk
          path: out/ndrXmic.apk
